name: Django CI/CD Pipeline  # Название workflow, отображается в GitHub Actions

on: [ push, pull_request ]  # Триггеры: запуск при push и создании pull request

jobs:
  # Job для запуска тестов
  test:
    runs-on: ubuntu-latest  # Запускать на последней версии Ubuntu

    # Сервисы, которые нужны для тестов (PostgreSQL и Redis)
    services:
      postgres:
        image: postgres:15  # Образ PostgreSQL 15
        env:
          POSTGRES_DB: test_db  # Имя тестовой базы данных
          POSTGRES_USER: postgres  # Пользователь БД
          POSTGRES_PASSWORD: postgres  # Пароль БД
        options: >-  # Настройки health check
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432  # Проброс порта PostgreSQL

      redis:
        image: redis:7  # Образ Redis 7
        options: >-  # Настройки healthcheck для Redis
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379  # Проброс порта Redis

    steps:
      # Шаг 1: Клонирование репозитория
      - name: Check out code
        uses: actions/checkout@v4  # Action для клонирования кода

      # Шаг 2: Установка Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Версия Python (должна совпадать с проектом)

      # Шаг 3: Установка зависимостей через Poetry
      - name: Install dependencies
        run: |
          pip install poetry  # Установка менеджера зависимостей Poetry
          poetry install  # Установка зависимостей проекта

      # Шаг 4: Запуск миграций и тестов
      - name: Run migrations and tests
        run: |
          poetry run python manage.py migrate  # Применение миграций БД
          poetry run python manage.py test  # Запуск тестов Django
        env: # Переменные окружения для подключения к сервисам
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

  # Job для проверки качества кода (линтер)
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Установка линтера flake8
      - name: Install flake8
        run: pip install flake8

      # Запуск линтера для проверки стиля кода
      - name: Run flake8
        run: flake8 .  # Проверка всего кода на соответствие PEP8

  # Job для деплоя в develop-окружение
  deploy_develop:
    runs-on: ubuntu-latest
    needs: [ test, lint ]  # Зависит от успешного выполнения test и lint jobs
    if: github.ref == 'refs/heads/develop'  # Выполнять только для ветки develop

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Сборка Docker образа для develop
      - name: Build Docker image for develop
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/onlineeducation:develop .

      # Деплой на сервер через SSH
      - name: Deploy to Server (develop)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}  # IP адрес сервера из secrets
          username: maria  # Имя пользователя на сервере
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Приватный SSH ключ
          script: |  # Команды выполняемые на сервере
            cd /home/maria/Online-Education  # Переход в директорию проекта
            docker compose down  # Остановка текущих контейнеров
            docker compose up -d  # Запуск новых контейнеров в фоне

  # Job для деплоя в production-окружение
  deploy_production:
    runs-on: ubuntu-latest
    needs: [ test, lint ]  # Зависит от успешного выполнения test и lint jobs
    if: github.ref == 'refs/heads/main'  # Выполнять только для ветки main

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Авторизация в Docker Hub
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # Сборка Docker образа с уникальным тегом (SHA коммита)
      - name: Build Docker image for production
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/onlineeducation:${{ github.sha }} .

      # Пуш образа в Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/onlineeducation:${{ github.sha }}

      # Деплой на production сервер
      - name: Deploy to Server (production)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: maria
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/maria/Online-Education
            docker compose down  # Остановка старых контейнеров
            docker compose pull  # Загрузка нового образа из Docker Hub
            docker compose up -d  # Запуск обновленных контейнеров